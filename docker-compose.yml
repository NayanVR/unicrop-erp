services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: web
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-unicrop}
      DB_USERNAME: ${DB_USERNAME:-unicrop}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      # Required when behind Dokploy's Traefik reverse proxy
      TRUSTED_PROXIES: "*"
      # S3 / Garage object storage
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_BUCKET: ${AWS_BUCKET:-unicrop-photos}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_started
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: queue
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-unicrop}
      DB_USERNAME: ${DB_USERNAME:-unicrop}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      # S3 / Garage object storage
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_BUCKET: ${AWS_BUCKET:-unicrop-photos}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-unicrop}
      DB_USERNAME: ${DB_USERNAME:-unicrop}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      # S3 / Garage object storage
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_BUCKET: ${AWS_BUCKET:-unicrop-photos}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-unicrop}
      MYSQL_USER: ${DB_USERNAME:-unicrop}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Garage S3-compatible object storage.
  # v2 flags used:
  #   --single-node         auto-creates the cluster layout (no manual garage layout apply)
  #   --default-bucket      creates GARAGE_DEFAULT_BUCKET on first boot
  #   --default-access-key  creates the key from GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY
  #
  # Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in Dokploy env vars — Garage will
  # create the key + bucket automatically using those same values, so the app can connect
  # without any manual init steps.
  #
  # After first start, set AWS_URL to http://<your-server-ip>:3900/unicrop-photos
  # so photo URLs are publicly reachable from browsers.
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket", "--default-access-key"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-GKunicropphotoapp000001}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-unicrop-change-this-secret-key-32ch}
      GARAGE_DEFAULT_BUCKET: ${AWS_BUCKET:-unicrop-photos}
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"
    restart: unless-stopped

volumes:
  mysql-data:
  storage:
  garage-meta:
  garage-data:
