<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7a2e"/>
      <stop offset="100%" stop-color="#8dc63f"/>
    </linearGradient>
  </defs>

  <!-- Outer diamond (border) -->
  <rect x="30" y="30" width="440" height="440" rx="60" ry="60"
        transform="rotate(45 250 250)"
        fill="url(#borderGrad)"/>

  <!-- Inner white diamond -->
  <rect x="82" y="82" width="336" height="336" rx="42" ry="42"
        transform="rotate(45 250 250)"
        fill="white"/>

  <!-- Leaf above U: two lobes + stem -->
  <g transform="translate(184, 106)">
    <path d="M28 44 C20 36 4 32 2 14 C2 14 16 6 30 22 Z" fill="#1a5c1a"/>
    <path d="M28 44 C36 36 52 32 54 14 C54 14 40 6 26 22 Z" fill="#1a5c1a"/>
    <line x1="28" y1="44" x2="28" y2="62" stroke="#1a5c1a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- UBC text -->
  <text x="252" y="362"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="182"
        font-weight="900"
        fill="#1a5c1a"
        text-anchor="middle"
        letter-spacing="-5">UBC</text>
</svg>
