<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8ec63f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer diamond border -->
  <rect x="20" y="20" width="160" height="160" rx="28" ry="28"
        transform="rotate(45 100 100)"
        fill="url(#borderGrad)" />

  <!-- Inner white diamond -->
  <rect x="36" y="36" width="128" height="128" rx="20" ry="20"
        transform="rotate(45 100 100)"
        fill="white" />

  <!-- Leaf above U -->
  <g transform="translate(58, 52)">
    <path d="M18 0 C18 0 30 4 26 16 C22 12 10 12 10 12 C10 12 6 0 18 0Z"
          fill="#1a5c1a" />
    <line x1="18" y1="0" x2="18" y2="16" stroke="#1a5c1a" stroke-width="1.5"/>
  </g>

  <!-- UBC text -->
  <text x="100" y="135"
        font-family="Arial Black, Arial, sans-serif"
        font-size="58"
        font-weight="900"
        fill="#1a5c1a"
        text-anchor="middle"
        letter-spacing="-2">UBC</text>
</svg>
