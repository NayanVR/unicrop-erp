metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

# Replaced at container start by garage-entrypoint.sh using $GARAGE_RPC_SECRET.
# Generate your own with: openssl rand -hex 32
rpc_secret = "REPLACE_WITH_64_HEX_CHARS_openssl_rand_hex_32"

bootstrap_peers = []

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.local"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.local"
index = "index.html"
error_document = "404.html"

[admin]
api_bind_addr = "[::]:3903"
